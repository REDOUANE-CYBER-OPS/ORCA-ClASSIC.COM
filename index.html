<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري الإلكتروني - ORCA-CLASSIC</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; }
        header { background-color: #2c3e50; color: white; padding: 25px; text-align: center; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        h2 { margin-bottom: 20px; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .gallery-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.3s; }
        .gallery-card:hover { transform: translateY(-5px); }
        .img-container { width: 100%; height: 220px; background-color: #eee; overflow: hidden; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        .card-info { padding: 15px; }
        .card-info h3 { font-size: 18px; margin-bottom: 10px; color: #2c3e50; }
        .card-info p { font-size: 14px; color: #666; margin-bottom: 15px; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; }
        .price { font-size: 18px; font-weight: bold; color: #e74c3c; }
        .btn { background-color: #3498db; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; transition: background 0.2s; }
        .btn:hover { background-color: #2980b9; }
    </style>
</head>
<body>

    <header>
        <h1>مرحباً بكم في متجرنا</h1>
        <p>ORCA-CLASSIC.COM</p>
    </header>

    <div class="container">
        <h2>منتجاتنا</h2>
        
        <div class="gallery-grid" id="gallery">
            <!-- المنتج الأول -->
            <div class="gallery-card">
                <div class="img-container">
                    <img src="اسم_صورتك_الأولى.png" alt="منتج 1">
                </div>
                <div class="card-info">
                    <h3>اسم المنتج الأول</h3>
                    <p>أضف وصفاً مختصراً لمنتجك هنا لتوضيح مميزاته.</p>
                    <div class="card-footer">
                        <span class="price">$السعر</span>
                        <button class="btn" onclick="alert('تمت إضافة المنتج للسلة!')">اطلب الآن</button>
                    </div>
                </div>
            </div>

            <!-- المنتج الثاني -->
            <div class="gallery-card">
                <div class="img-container">
                    <img src="اسم_صورتك_الثانية.png" alt="منتج 2">
                </div>
                <div class="card-info">
                    <h3>اسم المنتج الثاني</h3>
                    <p>أضف وصفاً مختصراً لمنتجك هنا لتوضيح مميزاته.</p>
                    <div class="card-footer">
                        <span class="price">$السعر</span>
                        <button class="btn" onclick="alert('تمت إضافة المنتج للسلة!')">اطلب الآن</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
